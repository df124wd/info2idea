[project]
name = "info2idea"
version = "0.1.0"
description = "A local-first opportunity radar that turns public information feeds into monetizable idea cards."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "info2idea" }
]
dependencies = []

[project.scripts]
info2idea = "info2idea.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
info2idea = ["web/*"]
