<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Info2Idea</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Info2Idea</h1>
        <p>Opportunity radar · Idea engine · Source monitor</p>
      </div>
      <button id="run-button" type="button">Refresh</button>
    </header>

    <main>
      <section class="metrics" aria-label="Overview">
        <article>
          <span>Signals</span>
          <strong id="article-count">0</strong>
        </article>
        <article>
          <span>Ideas</span>
          <strong id="idea-count">0</strong>
        </article>
        <article>
          <span>Topics</span>
          <strong id="topic-count">0</strong>
        </article>
        <article>
          <span>Sources</span>
          <strong id="source-count">0</strong>
        </article>
        <article>
          <span>Healthy</span>
          <strong id="healthy-source-count">0</strong>
        </article>
        <article>
          <span>Watching</span>
          <strong id="watch-count">0</strong>
        </article>
        <article>
          <span>Archived</span>
          <strong id="archive-count">0</strong>
        </article>
        <article>
          <span>AI analyzed</span>
          <strong id="ai-count">0</strong>
        </article>
        <article>
          <span>Latest fetch</span>
          <strong id="latest-fetch">-</strong>
        </article>
      </section>

      <section class="source-panel">
        <div class="section-title">
          <h2>Source Health</h2>
          <span>Last collection run by source</span>
        </div>
        <div class="toolbar" aria-label="Source filters">
          <button class="filter active" data-source-status="" type="button">All</button>
          <button class="filter" data-source-status="ok" type="button">OK</button>
          <button class="filter" data-source-status="empty" type="button">Empty</button>
          <button class="filter" data-source-status="error" type="button">Error</button>
        </div>
        <div id="source-list" class="source-list"></div>
      </section>

      <section class="layout">
        <div>
          <div class="section-title">
            <h2>High-Signal Ideas</h2>
            <span id="run-status"></span>
          </div>
          <div class="toolbar" aria-label="Signal filters">
            <button class="filter active" data-signal-status="" type="button">All</button>
            <button class="filter" data-signal-status="build_now" type="button">Build</button>
            <button class="filter" data-signal-status="validate_7_days" type="button">Validate</button>
            <button class="filter" data-signal-status="watch" type="button">Watch</button>
            <button class="filter" data-signal-status="archive" type="button">Archive</button>
          </div>
          <div id="idea-list" class="idea-list"></div>
        </div>

        <aside>
          <h2>Opportunity Topics</h2>
          <div id="topic-list" class="article-list"></div>
          <h2 class="aside-title">Recent Signals</h2>
          <div id="article-list" class="article-list"></div>
        </aside>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
